<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Planilha de Gastos</title>

  <!-- Favicon (guia do navegador) -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" href="icon.png">

  <!-- PWA + iOS Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planilha">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Firebase (compat — funciona sem build/npm) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <!-- Dark mode: apply before first paint to prevent flash -->
  <script>if(localStorage.getItem('pg_theme')==='dark')document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="h-full bg-gray-50 font-sans">
<div id="app" class="h-full">

  <!-- Login Screen -->
  <div id="login-screen" class="hidden fixed inset-0 bg-gradient-to-br from-indigo-50 to-white flex items-center justify-center z-50 p-6">
    <div class="w-full max-w-sm text-center">
      <div class="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-1">Planilha de Gastos</h1>
      <p class="text-sm text-gray-500 mb-8">Controle financeiro familiar</p>
      <button id="btn-google-login" onclick="App.signIn()"
        class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-200 text-gray-700 rounded-2xl py-3.5 text-sm font-semibold hover:border-indigo-300 hover:bg-indigo-50 transition-all shadow-sm disabled:opacity-60">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Entrar com Google
      </button>
      <p class="text-xs text-gray-400 mt-4 leading-relaxed">
        Seus dados ficam salvos na nuvem e sincronizados<br>entre todos os dispositivos em tempo real.
      </p>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="fixed inset-0 flex items-center justify-center bg-white z-50">
    <div class="text-center">
      <div class="flex items-end gap-[5px] h-10 justify-center mb-5">
        <span class="loader-bar"></span>
        <span class="loader-bar"></span>
        <span class="loader-bar"></span>
        <span class="loader-bar"></span>
        <span class="loader-bar"></span>
      </div>
      <p class="text-xs text-gray-400 font-medium tracking-widest uppercase">Carregando</p>
    </div>
  </div>

  <!-- Main Layout -->
  <div id="main-layout" class="hidden h-full">
    <div class="flex h-full">

      <!-- Sidebar (desktop) -->
      <aside class="hidden lg:flex lg:flex-col lg:w-64 lg:fixed lg:inset-y-0 bg-white border-r border-gray-100 shadow-sm z-10">
        <div class="flex items-center px-5 py-5 border-b border-gray-100">
          <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center mr-3">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-sm font-bold text-gray-900 leading-tight">Planilha de Gastos</h1>
            <p class="text-xs text-gray-400">Controle financeiro</p>
          </div>
        </div>

        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
          <button onclick="navigateTo('dashboard')" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all text-gray-600 hover:bg-gray-50" data-page="dashboard">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Dashboard
          </button>
          <button onclick="navigateTo('transactions')" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all text-gray-600 hover:bg-gray-50" data-page="transactions">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
            </svg>
            Transações
          </button>
          <button onclick="navigateTo('simulator')" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all text-gray-600 hover:bg-gray-50" data-page="simulator">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            Simulador
          </button>
          <button onclick="navigateTo('history')" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all text-gray-600 hover:bg-gray-50" data-page="history">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            Histórico
          </button>
          <button onclick="navigateTo('investimentos')" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all text-gray-600 hover:bg-gray-50" data-page="investimentos">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
            </svg>
            Investimentos
          </button>
          <button onclick="navigateTo('cartoes')" class="nav-btn w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all text-gray-600 hover:bg-gray-50" data-page="cartoes">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
            </svg>
            Cartões
          </button>
        </nav>

        <div class="px-4 py-4 border-t border-gray-100 space-y-3">
          <!-- Planilha ativa -->
          <button onclick="UIPlanilhas.showManage()"
            class="w-full flex items-center gap-2.5 px-2 py-2 hover:bg-gray-50 rounded-xl transition-colors text-left">
            <div class="w-7 h-7 bg-indigo-100 rounded-lg flex items-center justify-center flex-shrink-0">
              <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-xs text-gray-400">Planilha ativa</p>
              <p data-planilha-name class="text-xs font-semibold text-gray-700 truncate"></p>
            </div>
            <svg class="w-3.5 h-3.5 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <!-- Usuário logado -->
          <div class="flex items-center gap-2.5">
            <img id="user-avatar" class="w-7 h-7 rounded-full object-cover hidden" src="" alt="">
            <div class="flex-1 min-w-0">
              <p id="user-name" class="text-xs font-semibold text-gray-700 truncate"></p>
            </div>
            <button onclick="Theme.toggle()" title="Alternar tema"
              class="p-1.5 text-gray-300 hover:text-indigo-500 hover:bg-indigo-50 rounded-lg transition-colors flex-shrink-0">
              <!-- Moon (shown in light mode) -->
              <svg data-theme-icon="moon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
              <!-- Sun (shown in dark mode) -->
              <svg data-theme-icon="sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
            </button>
            <button onclick="App.signOut()"
              title="Sair"
              class="p-1.5 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
            </button>
          </div>
          <p id="sidebar-month" class="text-xs text-gray-400 font-medium"></p>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 lg:ml-64 flex flex-col min-h-screen">

        <!-- Top Bar -->
        <header class="bg-white border-b border-gray-100 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-10">
          <div>
            <h2 id="page-title" class="text-base font-bold text-gray-900">Dashboard</h2>
            <p id="page-subtitle" class="text-xs text-gray-400"></p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="Theme.toggle()" title="Alternar tema"
              class="lg:hidden p-1.5 text-gray-400 hover:text-indigo-500 hover:bg-indigo-50 rounded-lg transition-colors">
              <svg data-theme-icon="moon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
              <svg data-theme-icon="sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
            </button>
            <button onclick="UIPlanilhas.showManage()"
              class="lg:hidden flex items-center gap-1.5 text-xs text-gray-500 bg-gray-50 border border-gray-200 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 transition-colors max-w-[120px]">
              <svg class="w-3.5 h-3.5 flex-shrink-0 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
              </svg>
              <span data-planilha-name class="truncate font-medium"></span>
            </button>
            <div id="month-selector-wrap">
              <select id="month-selector" onchange="App.changeMonth(this.value)"
                class="text-xs border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
              </select>
            </div>
          </div>
        </header>

        <!-- Page Content -->
        <div id="page-content" class="flex-1 p-4 lg:p-6 pb-24 lg:pb-6 overflow-y-auto">
        </div>
      </main>
    </div>

    <!-- Bottom Nav (mobile only) -->
    <nav class="lg:hidden fixed bottom-0 inset-x-0 bg-white border-t border-gray-100 z-20 safe-area-bottom">
      <div class="flex overflow-x-auto" style="-ms-overflow-style:none;scrollbar-width:none">
        <button onclick="navigateTo('dashboard')" class="mobile-nav-btn flex-shrink-0 w-16 flex flex-col items-center gap-0.5 py-2.5 text-gray-400 transition-colors" data-page="dashboard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          <span class="text-[9px] font-medium">Início</span>
        </button>
        <button onclick="navigateTo('transactions')" class="mobile-nav-btn flex-shrink-0 w-16 flex flex-col items-center gap-0.5 py-2.5 text-gray-400 transition-colors" data-page="transactions">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
          </svg>
          <span class="text-[9px] font-medium">Transações</span>
        </button>
        <button onclick="navigateTo('simulator')" class="mobile-nav-btn flex-shrink-0 w-16 flex flex-col items-center gap-0.5 py-2.5 text-gray-400 transition-colors" data-page="simulator">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <span class="text-[9px] font-medium">Simulador</span>
        </button>
        <button onclick="navigateTo('history')" class="mobile-nav-btn flex-shrink-0 w-16 flex flex-col items-center gap-0.5 py-2.5 text-gray-400 transition-colors" data-page="history">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          <span class="text-[9px] font-medium">Histórico</span>
        </button>
        <button onclick="navigateTo('investimentos')" class="mobile-nav-btn flex-shrink-0 w-16 flex flex-col items-center gap-0.5 py-2.5 text-gray-400 transition-colors" data-page="investimentos">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
          <span class="text-[9px] font-medium">Aportes</span>
        </button>
        <button onclick="navigateTo('cartoes')" class="mobile-nav-btn flex-shrink-0 w-16 flex flex-col items-center gap-0.5 py-2.5 text-gray-400 transition-colors" data-page="cartoes">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
          </svg>
          <span class="text-[9px] font-medium">Cartões</span>
        </button>
      </div>
    </nav>

    <!-- FAB (mobile only) -->
    <div id="fab-container" class="lg:hidden fixed bottom-24 right-4 z-30 flex flex-col items-end gap-2">
      <div id="fab-menu" style="display:none" class="flex-col items-end gap-2 pb-1">
        <button onclick="UITransactions.openForm('expense'); FAB.close()"
          class="flex items-center gap-2 bg-red-600 text-white pl-3 pr-4 py-2.5 rounded-2xl shadow-lg text-sm font-semibold active:scale-95 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/></svg>
          Saída
        </button>
        <button onclick="UITransactions.openForm('income'); FAB.close()"
          class="flex items-center gap-2 bg-green-600 text-white pl-3 pr-4 py-2.5 rounded-2xl shadow-lg text-sm font-semibold active:scale-95 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          Entrada
        </button>
      </div>
      <button id="fab-btn" onclick="FAB.toggle()"
        class="w-14 h-14 bg-indigo-600 text-white rounded-full shadow-xl flex items-center justify-center active:scale-95 transition-all">
        <svg id="fab-icon" class="w-6 h-6 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end lg:items-center justify-center p-0 lg:p-4" onclick="Modal.closeOnOverlay(event)">
    <div id="modal-box" class="bg-white w-full max-w-lg rounded-t-2xl lg:rounded-2xl max-h-[92vh] overflow-y-auto">
    </div>
  </div>
